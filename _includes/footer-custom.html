<script>
(function() {
  'use strict';
  
  // Map section titles to tab labels
  const sectionMap = {
    'Education': 'Education',
    'Work Experience': 'Experience', 
    'Selected Projects and Research': 'Research',
    'Personal Projects': 'Projects',
    'Finance Projects': 'Finance',
    'Publications': 'Publications',
    'Presentations': 'Presentations',
    'Sample Research Poster': 'Posters',
    'Sample Industry Poster': 'Posters'
  };

  function initTabs() {
    const sections = {};
    const tabLabels = new Set();
    
    // Find all h2 headings and match them to sections
    const headings = document.querySelectorAll('main h2, main h3');
    
    headings.forEach(heading => {
      const text = heading.textContent.trim();
      const tabLabel = sectionMap[text];
      
      if (tabLabel) {
        tabLabels.add(tabLabel);
        
        // Find the container for this section - look for parent with class 'container' or closest section/div
        let container = heading.parentElement;
        let found = false;
        
        // Try to find .container parent
        while (container && container !== document.body) {
          if (container.classList && container.classList.contains('container')) {
            found = true;
            break;
          }
          container = container.parentElement;
        }
        
        // If no .container found, use the parent element
        if (!found) {
          container = heading.parentElement;
        }
        
        if (!sections[tabLabel]) {
          sections[tabLabel] = [];
        }
        if (!sections[tabLabel].includes(container)) {
          sections[tabLabel].push(container);
        }
      }
    });

    if (Object.keys(sections).length === 0) {
      console.log('Tabs: No sections found');
      return;
    }

    // Handle poster sections - combine them
    if (sections['Posters'] && sections['Posters'].length > 1) {
      const posters = sections['Posters'];
      const firstPoster = posters[0];
      const parent = firstPoster.parentElement;
      
      const wrapper = document.createElement('div');
      wrapper.className = 'container section-in-tabs';
      wrapper.setAttribute('data-tab-section', 'Posters');
      wrapper.style.display = 'none';
      
      parent.insertBefore(wrapper, firstPoster);
      posters.forEach(post => wrapper.appendChild(post));
      sections['Posters'] = [wrapper];
    }

    // Mark all sections
    Object.keys(sections).forEach(tabLabel => {
      sections[tabLabel].forEach(container => {
        container.classList.add('section-in-tabs');
        container.setAttribute('data-tab-section', tabLabel);
        container.style.display = 'none';
      });
    });

    // Find insertion point
    const aboutMe = document.getElementById('about-me');
    const mainContent = document.querySelector('main');
    
    if (!mainContent) {
      console.log('Tabs: No main content found');
      return;
    }

    // Create navigation
    const navContainer = document.createElement('div');
    navContainer.className = 'main-nav-tabs';
    navContainer.style.cssText = 'margin: 20px 0; text-align: center; padding: 10px;';
    
    const navList = document.createElement('div');
    navList.className = 'tabs-nav';
    navList.style.cssText = 'display: inline-flex; gap: 10px; flex-wrap: wrap; justify-content: center;';
    
    const tabLabelsArray = Array.from(tabLabels).sort();
    tabLabelsArray.forEach((tabLabel, index) => {
      const button = document.createElement('button');
      button.className = 'tab-button' + (index === 0 ? ' active' : '');
      button.textContent = tabLabel;
      button.setAttribute('data-tab', tabLabel);
      button.setAttribute('type', 'button');
      button.style.cssText = 'padding: 8px 16px; margin: 5px; border: 1px solid #ccc; background: ' + (index === 0 ? '#333; color: white;' : '#f5f5f5; color: #333;') + ' cursor: pointer; border-radius: 4px; font-size: 14px;';
      button.addEventListener('click', function() { switchTab(tabLabel); });
      navList.appendChild(button);
    });
    
    navContainer.appendChild(navList);
    
    // Insert navigation
    const aboutMeContainer = aboutMe ? aboutMe.closest('.container') : null;
    if (aboutMeContainer && aboutMeContainer.nextSibling) {
      aboutMeContainer.parentElement.insertBefore(navContainer, aboutMeContainer.nextSibling);
    } else if (mainContent.firstChild) {
      mainContent.insertBefore(navContainer, mainContent.firstChild);
    } else {
      mainContent.appendChild(navContainer);
    }

    // Show first tab
    if (tabLabelsArray.length > 0) {
      switchTab(tabLabelsArray[0], false);
    }
  }

  function switchTab(tabLabel) {
    // Update button styles
    document.querySelectorAll('.tab-button').forEach(btn => {
      if (btn.getAttribute('data-tab') === tabLabel) {
        btn.style.background = '#333';
        btn.style.color = 'white';
        btn.classList.add('active');
      } else {
        btn.style.background = '#f5f5f5';
        btn.style.color = '#333';
        btn.classList.remove('active');
      }
    });

    // Show/hide sections
    document.querySelectorAll('.section-in-tabs').forEach(section => {
      if (section.getAttribute('data-tab-section') === tabLabel) {
        section.style.display = 'block';
      } else {
        section.style.display = 'none';
      }
    });
  }

  // Initialize with retry logic
  function tryInit() {
    const main = document.querySelector('main');
    const headings = document.querySelectorAll('main h2');
    
    if (main && headings.length > 0) {
      // Wait a bit more for full rendering
      setTimeout(initTabs, 300);
    } else {
      setTimeout(tryInit, 200);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(tryInit, 500);
    });
  } else {
    setTimeout(tryInit, 500);
  }
})();
</script>
