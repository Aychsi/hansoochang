<script>
// Tabs implementation - completely rewritten for reliability
(function() {
  'use strict';
  if (window.__tabsInit) return;
  window.__tabsInit = true;

  // Section mapping - order matters for first tab
  var sectionOrder = [
    {id: 'education', label: 'Education'},
    {id: 'work-experience', label: 'Experience'},
    {id: 'selected-projects-and-research', label: 'Research'},
    {id: 'personal-projects', label: 'Projects'},
    {id: 'finance-projects', label: 'Finance'},
    {id: 'publications', label: 'Publications'},
    {id: 'presentations', label: 'Presentations'},
    {id: 'sample-research-poster', label: 'Posters'},
    {id: 'sample-industry-poster', label: 'Posters'}
  ];

  function init() {
    var sections = {};
    var labels = [];
    var foundSections = [];
    
    // Find all sections in order
    sectionOrder.forEach(function(item) {
      var heading = document.getElementById(item.id);
      if (heading) {
        var container = heading.closest('.container');
        if (container) {
          var label = item.label;
          
          // Track unique labels
          if (labels.indexOf(label) === -1) {
            labels.push(label);
          }
          
          if (!sections[label]) {
            sections[label] = [];
          }
          sections[label].push(container);
          foundSections.push({container: container, label: label});
        }
      }
    });

    if (foundSections.length === 0) {
      console.log('Tabs: No sections found');
      return;
    }

    // Handle poster sections - combine them
    if (sections['Posters'] && sections['Posters'].length > 1) {
      var posters = sections['Posters'];
      var firstPoster = posters[0];
      var parent = firstPoster.parentElement;
      
      // Create wrapper
      var wrapper = document.createElement('div');
      wrapper.className = 'container list-container section-in-tabs';
      wrapper.setAttribute('data-tab', 'Posters');
      wrapper.style.display = 'none';
      
      // Insert wrapper before first poster
      parent.insertBefore(wrapper, firstPoster);
      
      // Move all poster containers into wrapper
      posters.forEach(function(poster) {
        wrapper.appendChild(poster);
      });
      
      sections['Posters'] = [wrapper];
    }

    // Mark and hide all sections
    foundSections.forEach(function(item) {
      // Skip if this is a poster (already handled)
      if (item.label === 'Posters' && sections['Posters'] && sections['Posters'].length > 1) {
        return;
      }
      
      item.container.classList.add('section-in-tabs');
      item.container.setAttribute('data-tab', item.label);
      item.container.style.display = 'none';
    });

    // Also mark the posters wrapper if it exists
    if (sections['Posters'] && sections['Posters'].length === 1 && sections['Posters'][0].classList.contains('section-in-tabs')) {
      // Already marked
    } else if (sections['Posters'] && sections['Posters'].length === 1) {
      sections['Posters'][0].classList.add('section-in-tabs');
      sections['Posters'][0].setAttribute('data-tab', 'Posters');
      sections['Posters'][0].style.display = 'none';
    }

    // Find where to insert navigation
    var aboutMe = document.getElementById('about-me');
    var main = document.querySelector('main');
    if (!main) {
      console.log('Tabs: No main element found');
      return;
    }

    // Create navigation bar
    var nav = document.createElement('div');
    nav.className = 'main-nav-tabs';
    var navList = document.createElement('div');
    navList.className = 'tabs-nav';
    
    // Create buttons in order (not sorted)
    var firstLabel = null;
    labels.forEach(function(label, i) {
      // Use the first non-Posters label as default, or first label if all are Posters
      if (i === 0 || (firstLabel === null && label !== 'Posters')) {
        firstLabel = label;
      }
      
      var btn = document.createElement('button');
      btn.className = 'tab-button' + (i === 0 && label !== 'Posters' ? ' active' : '');
      btn.textContent = label;
      btn.setAttribute('data-tab', label);
      btn.type = 'button';
      btn.onclick = function() { 
        showTab(label); 
      };
      navList.appendChild(btn);
    });
    
    nav.appendChild(navList);
    
    // Insert navigation after About Me section
    var aboutContainer = aboutMe ? aboutMe.closest('.container') : null;
    if (aboutContainer && aboutContainer.nextSibling) {
      aboutContainer.parentElement.insertBefore(nav, aboutContainer.nextSibling);
    } else if (main.firstChild) {
      main.insertBefore(nav, main.firstChild);
    } else {
      main.appendChild(nav);
    }

    // Show first tab (Education, not Posters)
    var tabToShow = firstLabel || labels[0];
    if (tabToShow) {
      showTab(tabToShow, false);
    }
  }

  function showTab(label, scroll) {
    scroll = scroll !== false;
    
    // Update button states
    document.querySelectorAll('.tab-button').forEach(function(btn) {
      if (btn.getAttribute('data-tab') === label) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    // Hide ALL sections first
    document.querySelectorAll('.section-in-tabs').forEach(function(section) {
      section.style.display = 'none';
      section.classList.remove('active');
    });
    
    // Show the selected tab's sections
    var shown = false;
    document.querySelectorAll('.section-in-tabs[data-tab="' + label + '"]').forEach(function(section) {
      section.style.display = 'block';
      section.classList.add('active');
      shown = true;
    });
    
    if (!shown) {
      console.log('Tabs: No sections found for label:', label);
    }
    
    // Scroll to navigation if needed
    if (scroll) {
      var nav = document.querySelector('.main-nav-tabs');
      if (nav) {
        nav.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  }

  // Initialize when DOM is ready
  function tryRun() {
    var main = document.querySelector('main');
    var edu = document.getElementById('education');
    if (main && edu) {
      setTimeout(init, 150);
    } else {
      if (typeof tryRun.retries === 'undefined') {
        tryRun.retries = 0;
      }
      tryRun.retries++;
      if (tryRun.retries < 50) {
        setTimeout(tryRun, 100);
      } else {
        console.log('Tabs: Could not find required elements after 5 seconds');
      }
    }
  }

  // Start initialization
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', tryRun);
  } else {
    tryRun();
  }
})();
</script>
