<script>
// Tabs implementation - fixed version
(function() {
  'use strict';
  if (window.__tabsInit) return;
  window.__tabsInit = true;

  var map = {
    'education': 'Education',
    'work-experience': 'Experience',
    'selected-projects-and-research': 'Research',
    'personal-projects': 'Projects',
    'finance-projects': 'Finance',
    'publications': 'Publications',
    'presentations': 'Presentations',
    'sample-research-poster': 'Posters',
    'sample-industry-poster': 'Posters'
  };

  function init() {
    var sections = {};
    var labels = [];
    
    // Find all sections by their h3 IDs
    for (var id in map) {
      var heading = document.getElementById(id);
      if (heading) {
        var label = map[id];
        // Find the parent container (the div.container.list-container that contains this h3)
        var container = heading.parentElement;
        // Make sure it's a container
        if (container && container.classList.contains('container')) {
          if (!sections[label]) {
            sections[label] = [];
            if (labels.indexOf(label) === -1) {
              labels.push(label);
            }
          }
          sections[label].push(container);
        }
      }
    }

    if (labels.length === 0) {
      console.log('No sections found for tabs');
      return;
    }

    // Handle poster sections - combine them into one
    if (sections['Posters'] && sections['Posters'].length > 1) {
      var posters = sections['Posters'];
      var firstPoster = posters[0];
      var parent = firstPoster.parentElement;
      
      // Create wrapper
      var wrapper = document.createElement('div');
      wrapper.className = 'container list-container section-in-tabs';
      wrapper.setAttribute('data-tab', 'Posters');
      wrapper.style.display = 'none';
      
      // Insert wrapper before first poster
      parent.insertBefore(wrapper, firstPoster);
      
      // Move all poster containers into wrapper
      posters.forEach(function(poster) {
        wrapper.appendChild(poster);
      });
      
      sections['Posters'] = [wrapper];
    }

    // Hide all sections and mark them
    for (var label in sections) {
      sections[label].forEach(function(container) {
        container.classList.add('section-in-tabs');
        container.setAttribute('data-tab', label);
        container.style.display = 'none';
      });
    }

    // Find where to insert navigation
    var aboutMe = document.getElementById('about-me');
    var main = document.querySelector('main');
    if (!main) return;

    // Create navigation bar
    var nav = document.createElement('div');
    nav.className = 'main-nav-tabs';
    var navList = document.createElement('div');
    navList.className = 'tabs-nav';
    
    // Sort labels and create buttons
    labels.sort();
    labels.forEach(function(label, i) {
      var btn = document.createElement('button');
      btn.className = 'tab-button' + (i === 0 ? ' active' : '');
      btn.textContent = label;
      btn.setAttribute('data-tab', label);
      btn.type = 'button';
      btn.onclick = function() { 
        showTab(label); 
      };
      navList.appendChild(btn);
    });
    
    nav.appendChild(navList);
    
    // Insert navigation after About Me section
    var aboutContainer = aboutMe ? aboutMe.closest('.container') : null;
    if (aboutContainer && aboutContainer.nextSibling) {
      aboutContainer.parentElement.insertBefore(nav, aboutContainer.nextSibling);
    } else if (main.firstChild) {
      main.insertBefore(nav, main.firstChild);
    } else {
      main.appendChild(nav);
    }

    // Show first tab by default
    if (labels.length > 0) {
      showTab(labels[0], false);
    }
  }

  function showTab(label, scroll) {
    if (scroll === undefined) scroll = true;
    
    // Update button states
    document.querySelectorAll('.tab-button').forEach(function(btn) {
      btn.classList.remove('active');
      if (btn.getAttribute('data-tab') === label) {
        btn.classList.add('active');
      }
    });

    // Hide all sections
    document.querySelectorAll('.section-in-tabs').forEach(function(section) {
      section.style.display = 'none';
      section.classList.remove('active');
    });
    
    // Show the selected tab's sections
    document.querySelectorAll('.section-in-tabs[data-tab="' + label + '"]').forEach(function(section) {
      section.style.display = 'block';
      section.classList.add('active');
    });
    
    // Scroll to navigation if needed
    if (scroll) {
      var nav = document.querySelector('.main-nav-tabs');
      if (nav) {
        nav.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  }

  // Initialize when DOM is ready
  function tryRun() {
    var main = document.querySelector('main');
    var edu = document.getElementById('education');
    if (main && edu) {
      // Wait a bit for everything to render
      setTimeout(init, 100);
    } else {
      if (typeof tryRun.retries === 'undefined') {
        tryRun.retries = 0;
      }
      tryRun.retries++;
      if (tryRun.retries < 50) {
        setTimeout(tryRun, 100);
      } else {
        console.log('Tabs: Could not find required elements');
      }
    }
  }

  // Start initialization
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', tryRun);
  } else {
    tryRun();
  }
})();
</script>
