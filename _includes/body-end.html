<script>
// Tab navigation system - hide/show sections
(function() {
  'use strict';
  if (window.__tabsInit) return;
  window.__tabsInit = true;

  // Map section IDs to tab labels
  var sectionMap = {
    'education': 'Education',
    'work-experience': 'Experience',
    'selected-projects-and-research': 'Research',
    'personal-projects': 'Projects',
    'finance-projects': 'Finance',
    'publications': 'Publications',
    'presentations': 'Presentations',
    'sample-research-poster': 'Posters',
    'sample-industry-poster': 'Posters'
  };

  function initTabs() {
    var sections = {};
    var labels = [];
    
    // Find all sections
    for (var id in sectionMap) {
      var heading = document.getElementById(id);
      if (heading) {
        var label = sectionMap[id];
        var container = heading.closest('.container');
        if (container) {
          if (!sections[label]) {
            sections[label] = [];
            if (labels.indexOf(label) === -1) {
              labels.push(label);
            }
          }
          sections[label].push(container);
        }
      }
    }

    if (labels.length === 0) {
      console.log('No sections found');
      return;
    }

    // Handle poster sections - combine them
    if (sections['Posters'] && sections['Posters'].length > 1) {
      var posters = sections['Posters'];
      var firstPoster = posters[0];
      var parent = firstPoster.parentElement;
      
      var wrapper = document.createElement('div');
      wrapper.className = 'container list-container cv-tab-section';
      wrapper.setAttribute('data-tab', 'Posters');
      wrapper.style.display = 'none';
      
      parent.insertBefore(wrapper, firstPoster);
      posters.forEach(function(poster) {
        wrapper.appendChild(poster);
      });
      
      sections['Posters'] = [wrapper];
    }

    // Mark and hide all sections
    for (var label in sections) {
      sections[label].forEach(function(container) {
        container.classList.add('cv-tab-section');
        container.setAttribute('data-tab', label);
        container.style.display = 'none';
      });
    }

    // Find where to insert navigation
    var aboutMe = document.getElementById('about-me');
    var main = document.querySelector('main');
    if (!main) return;

    // Create navigation bar
    var nav = document.createElement('nav');
    nav.className = 'cv-tabs-nav';
    
    var navList = document.createElement('ul');
    navList.className = 'cv-tabs-list';
    
    // Create tab buttons - keep Education first
    var orderedLabels = ['Education', 'Experience', 'Research', 'Projects', 'Finance', 'Publications', 'Presentations', 'Posters'];
    var finalLabels = orderedLabels.filter(function(l) { return labels.indexOf(l) !== -1; });
    
    finalLabels.forEach(function(label, i) {
      var item = document.createElement('li');
      var btn = document.createElement('button');
      btn.className = 'cv-tab-btn' + (i === 0 ? ' active' : '');
      btn.textContent = label;
      btn.setAttribute('data-tab', label);
      btn.type = 'button';
      btn.onclick = function() {
        switchTab(label);
      };
      item.appendChild(btn);
      navList.appendChild(item);
    });
    
    nav.appendChild(navList);
    
    // Insert navigation after About Me
    var aboutContainer = aboutMe ? aboutMe.closest('.container') : null;
    if (aboutContainer && aboutContainer.nextSibling) {
      aboutContainer.parentElement.insertBefore(nav, aboutContainer.nextSibling);
    } else if (main.firstChild) {
      main.insertBefore(nav, main.firstChild);
    } else {
      main.appendChild(nav);
    }

    // Show first tab (Education)
    if (finalLabels.length > 0) {
      switchTab(finalLabels[0], false);
    }
  }

  function switchTab(label, scroll) {
    scroll = scroll !== false;
    
    // Update buttons
    document.querySelectorAll('.cv-tab-btn').forEach(function(btn) {
      if (btn.getAttribute('data-tab') === label) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    // Hide all sections
    document.querySelectorAll('.cv-tab-section').forEach(function(section) {
      section.style.display = 'none';
    });
    
    // Show selected sections
    document.querySelectorAll('.cv-tab-section[data-tab="' + label + '"]').forEach(function(section) {
      section.style.display = 'block';
    });
    
    if (scroll) {
      var nav = document.querySelector('.cv-tabs-nav');
      if (nav) {
        nav.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  }

  // Initialize
  function tryInit() {
    var main = document.querySelector('main');
    var edu = document.getElementById('education');
    if (main && edu) {
      setTimeout(initTabs, 200);
    } else {
      if (typeof tryInit.retries === 'undefined') {
        tryInit.retries = 0;
      }
      tryInit.retries++;
      if (tryInit.retries < 50) {
        setTimeout(tryInit, 100);
      }
    }
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', tryInit);
  } else {
    tryInit();
  }
})();
</script>
